<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080a" />
    <title>Squish Labor · Verschmelzen</title>
    <style>
      :root { color-scheme: dark; font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { background: #07546a; overflow-x: hidden; }
      .water { position: fixed; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; background: #0b7993; }
      .wash { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(2, 30, 35, .14), transparent 28%, rgba(0, 22, 32, .1)); pointer-events: none; }
      .game { width: min(100%, 980px); min-height: 100svh; margin: 0 auto; padding: clamp(18px, 3vw, 36px) clamp(8px, 2vw, 26px) 28px; display: flex; flex-direction: column; gap: clamp(18px, 3vw, 30px); }
      .topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(42px, 1fr); align-items: start; gap: clamp(6px, 1.8vw, 18px); }
      .brand { padding-top: 9px; text-shadow: 0 2px 16px rgba(0, 34, 35, .5); }
      .wordmark { font-size: clamp(2rem, 7vw, 3.85rem); font-weight: 300; letter-spacing: .14em; line-height: .85; color: #fff; white-space: nowrap; }
      .wordmark sup { display: inline-block; margin-left: .05em; font-size: .42em; font-weight: 500; letter-spacing: 0; vertical-align: top; transform: translateY(-.1em); }
      .motto { margin: 12px 0 0; color: rgba(255,255,255,.95); font-size: clamp(.6rem, 2vw, .88rem); font-weight: 700; letter-spacing: .3em; white-space: nowrap; }
      .scores { width: clamp(112px, 25vw, 190px); border: 1px solid rgba(255,255,255,.28); border-radius: 25px; overflow: hidden; background: linear-gradient(145deg, rgba(9, 51, 63, .84), rgba(14, 71, 84, .68)); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 11px 28px rgba(0, 36, 43, .22); backdrop-filter: blur(12px); }
      .score { padding: 14px 10px 15px; text-align: center; }
      .score-label { display: block; color: #fff1a8; font-size: .69rem; font-weight: 800; letter-spacing: .16em; }
      .score-value { display: grid; place-items: center; margin-top: 6px; }
      .best-tile { width: clamp(44px, 11vw, 72px); font-size: clamp(1.25rem, 4vw, 2.25rem); }
      .score-value .best-tile.long-number { font-size: clamp(.65rem, 2.6vw, 1.35rem); }
      .pause { justify-self: end; width: clamp(48px, 8.5vw, 64px); aspect-ratio: 1; border: 1px solid rgba(255,255,255,.33); border-radius: 50%; color: white; background: rgba(13, 40, 36, .6); box-shadow: inset 0 1px 1px rgba(255,255,255,.18), 0 7px 19px rgba(0,35,31,.25); backdrop-filter: blur(8px); font-size: 1.45rem; line-height: 1; cursor: pointer; }
      .pause:focus-visible { outline: 3px solid #fff4ad; outline-offset: 3px; }
      .playfield { align-self: center; position: relative; width: min(100%, 860px); margin: clamp(24px, 6svh, 105px) auto 0; filter: drop-shadow(0 20px 17px rgba(0, 35, 40, .36)); touch-action: none; user-select: none; -webkit-user-select: none; }
      .board { display: block; width: 100%; height: auto; border-radius: clamp(20px, 4vw, 38px); pointer-events: none; }
      .tiles { position: absolute; inset: 0; pointer-events: none; }
      .well-fronts, .well-fronts svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      .board-tile.is-travelling { z-index: 12; }
      .effects { position: absolute; inset: 0; z-index: 14; pointer-events: none; }
      .combo-badge { position: absolute; margin: 0; font-weight: 900; line-height: 1; white-space: nowrap; text-shadow: 0 2px 0 #176079, 0 4px 12px rgba(0,35,50,.55); transform: translate(-50%, -50%); }
      .combo-badge { left: 50%; top: 4%; padding: .32em .7em; border-radius: 999px; border: 1px solid rgba(255,240,173,.65); color: #fff1a5; background: rgba(6,65,78,.85); box-shadow: 0 5px 20px rgba(0,35,50,.25); font-size: clamp(.95rem, 4vw, 2rem); letter-spacing: .03em; }
      .merge-ring { position: absolute; height: auto; aspect-ratio: 1.35; border: 2px solid var(--effect-color, #c6ffff); border-radius: 50%; box-shadow: 0 0 12px rgba(181,255,255,.6); transform: translate(-50%, -50%); }
      .merge-bubble { position: absolute; width: clamp(5px, 1.5vw, 12px); aspect-ratio: 1; border: 1px solid rgba(255,255,255,.9); border-radius: 50%; background: radial-gradient(circle at 30% 25%, white, var(--effect-color, #83e8ef) 55%, rgba(72,205,224,.3)); box-shadow: 0 0 6px rgba(207,255,255,.5); }
      .merge-charge { position: absolute; aspect-ratio: 1.1; border: 2px solid #fff2b7; border-radius: 32%; background: radial-gradient(ellipse, rgba(255,231,147,.16), rgba(255,231,147,.38) 60%, transparent 74%); box-shadow: 0 0 15px rgba(255,235,152,.7), inset 0 0 10px rgba(255,247,191,.5); transform: translate(-50%, -50%); }
      .merge-ring.is-upgraded { border-width: 3px; box-shadow: 0 0 18px rgba(255,228,154,.85); }
      .upgrade-badge { position: absolute; display: grid; gap: 3px; justify-items: center; max-width: 40%; padding: 7px 13px; border: 1px solid #ffe8a4; border-radius: 16px; background: linear-gradient(135deg, rgba(5,49,65,.98), rgba(12,80,92,.97)); color: #fff1aa; box-shadow: 0 4px 20px rgba(0,35,50,.4), 0 0 16px rgba(255,216,112,.3); transform: translate(-50%, -50%); text-align: center; }
      .upgrade-jump { font-size: clamp(1rem, 4vw, 2.2rem); line-height: 1; font-weight: 900; white-space: nowrap; }
      .upgrade-caption { font-size: clamp(.75rem, 2.6vw, .875rem); line-height: 1.2; font-weight: 800; letter-spacing: .03em; }
      .tile { --hue: 0deg; position: relative; display: grid; place-items: center; aspect-ratio: 1; color: #f7ffff; font-weight: 800; line-height: 1; isolation: isolate; }
      .gel-idle { display: grid; place-items: center; width: 100%; height: 100%; transform-origin: 50% 89%; animation: gel-idle-sway var(--idle-duration, 4.8s) cubic-bezier(.45, 0, .55, 1) var(--idle-delay, 0s) infinite; }
      .game.is-paused .gel-idle { animation-play-state: paused; }
      @keyframes gel-idle-sway {
        0%, 100% { transform: skewX(0deg) scaleY(1); }
        24% { transform: skewX(var(--idle-lean)) scaleY(calc(1 - var(--idle-squash))); }
        57% { transform: skewX(calc(var(--idle-lean) * -.8)) scaleY(calc(1 + var(--idle-squash) * .8)); }
        81% { transform: skewX(calc(var(--idle-lean) * .45)) scaleY(calc(1 - var(--idle-squash) * .35)); }
      }
      .gel-body { position: relative; display: grid; place-items: center; width: 100%; height: 100%; transform-origin: 50% 89%; filter: drop-shadow(0 5px 3px rgba(3, 42, 68, .42)) drop-shadow(0 8px 7px rgba(2, 32, 48, .24)); }
      .board-tile .gel-body { filter: drop-shadow(0 2px 3px rgba(52,36,21,.38)) drop-shadow(2px 5px 5px rgba(44,31,21,.23)); }
      .gel-skin { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: contain; filter: hue-rotate(var(--hue)) saturate(1.08); pointer-events: none; }
      .tile-number { position: relative; z-index: 1; padding-bottom: .05em; color: var(--number-ink, #f7ffff); text-shadow: 0 2px 1px rgba(255,255,255,.26), 0 3px 4px rgba(0,37,91,.5); pointer-events: none; }
      .tile[data-material="Perle"] .tile-number, .tile[data-material="Gold"] .tile-number { text-shadow: 0 1px 2px rgba(255,255,255,.8), 0 0 5px rgba(255,255,255,.45); }
      .board-tile { position: absolute; z-index: var(--row-z, 0); aspect-ratio: auto; transform: translate(-50%, -50%); font-size: clamp(1.3rem, 6vw, 4rem); transition: left 290ms cubic-bezier(.22,.8,.3,1), top 290ms cubic-bezier(.22,.8,.3,1), width 290ms ease-out, height 290ms ease-out, opacity 210ms ease, transform 210ms ease; will-change: left, top; }
      .board-tile .tile-number { font-size: calc(1em * var(--row-scale, 1)); transition: font-size 290ms ease-out; }
      .board-tile .gel-plane { --plane-perspective: 220px; display: grid; place-items: center; width: 100%; height: 100%; transform: perspective(var(--plane-perspective)) rotateX(var(--plane-pitch, 18deg)) rotateY(var(--plane-yaw, 0deg)) skewX(var(--plane-shear, 0deg)) scaleY(var(--plane-height, 1.05)); transform-origin: 50% 55%; transition: transform 290ms cubic-bezier(.22,.8,.3,1); }
      .board-tile.is-pushing, .board-tile.is-pushing .gel-plane, .board-tile.is-pushing .tile-number { transition: none; }
      .board-tile .gel-skin { object-fit: fill; }
      .tile.long-number { font-size: clamp(.7rem, 3.2vw, 2.3rem); }
      .gesture-note { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); max-width: 86%; width: max-content; padding: 6px 12px; border-radius: 999px; color: #fff; background: rgba(4,47,62,.73); backdrop-filter: blur(8px); font-size: .82rem; font-weight: 650; text-align: center; text-shadow: 0 1px 4px rgba(0,0,0,.4); pointer-events: none; transition: opacity .3s ease; }
      .gesture-note[hidden] { display: none; }
      .preview { align-self: center; width: clamp(245px, 48vw, 420px); aspect-ratio: 2.35; display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(255,255,255,.48); border-radius: clamp(26px, 4vw, 42px); background: linear-gradient(145deg, rgba(20, 87, 104, .64), rgba(31, 119, 137, .32)); box-shadow: inset 0 1px 1px rgba(255,255,255,.35), 0 13px 28px rgba(0, 45, 56, .25); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
      .queue { display: flex; justify-content: center; align-items: center; gap: 2%; width: 100%; height: 100%; padding: 5%; }
      .preview-tile { width: 28%; max-height: 100%; font-size: clamp(1.3rem, 4.6vw, 3.5rem); }
      .veil { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: rgba(0,28,39,.56); backdrop-filter: blur(8px); }
      .veil[hidden] { display: none; }
      .dialog { width: min(100%, 350px); padding: 28px; border: 1px solid rgba(255,255,255,.4); border-radius: 28px; color: white; text-align: center; background: linear-gradient(145deg, rgba(8,62,75,.96), rgba(8,83,99,.92)); box-shadow: 0 20px 55px rgba(0,0,0,.3); }
      .dialog h2 { margin: 0 0 9px; font-size: 1.6rem; }
      .dialog p { margin: 0 0 22px; line-height: 1.45; }
      .dialog button { min-height: 44px; margin: 4px; padding: 9px 18px; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; color: white; background: rgba(255,255,255,.15); font: inherit; font-weight: 700; cursor: pointer; }
      .dialog button:first-of-type { background: #f6dc7b; color: #164653; }
      .dialog button[hidden] { display: none; }
      @media (max-width: 550px) { .wordmark { font-size: clamp(1.9rem, 7vw, 2.3rem); letter-spacing: .09em; } .motto { font-size: .58rem; letter-spacing: .13em; } .score { padding: 9px 5px 10px; } .score-label { font-size: .58rem; } .score-value { font-size: 1.35rem; } .pause { width: 42px; font-size: 1.15rem; } .board-tile .gel-plane { --plane-perspective: 110px; } }
      @media (max-width: 380px) { .topbar { gap: 5px; } .scores { width: 112px; } .wordmark { font-size: 1.8rem; } .motto { font-size: .52rem; } .pause { width: 38px; } }
      @media (prefers-reduced-motion: reduce) { .water { display: none; } body { background: radial-gradient(circle at 50% 10%, #59cce0, #0b6d84 55%, #045265); } .board-tile, .board-tile .gel-plane, .board-tile .tile-number { transition-duration: .01ms; } .gel-idle { animation: none; } }
      .brand-splash {position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;background:#08080a radial-gradient(ellipse at 50% 44%,#141824 0%,#0b0d13 32%,#08080a 70%);color-scheme:dark;}
      .brand-splash[hidden] {display:none;}
      .brand-lockup {display:grid;justify-items:center;gap:22px;width:min(78vw,540px);}
      .brand-splash img {display:block;width:100%;height:auto;max-height:54svh;object-fit:contain;}
      .squish-loader {width:min(100%,302px);text-align:center;}
      .squish-loader-track {position:relative;height:43px;padding:7px 8px;border:1px solid #68d3ff55;border-radius:13px;background:#111824;box-shadow:inset 0 1px #ffffff16,0 0 28px #31bfff29;}
      .squish-loader-fill {position:absolute;inset:0;border-radius:12px;background:linear-gradient(90deg,#095c826e,#48317d91,#901c6670);transform:scaleX(0);transform-origin:left;}
      .squish-loader-jellies {position:relative;display:flex;align-items:center;gap:4px;height:100%;}
      .loading-squish {position:relative;flex:1;min-width:0;height:100%;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--gel),white 24%);border-radius:8px;background:linear-gradient(153deg,color-mix(in srgb,var(--gel),white 28%),var(--gel) 52%,color-mix(in srgb,var(--gel),#08080a 28%));box-shadow:inset 0 1px #ffffff88,inset 0 -2px 4px #0003,0 0 8px color-mix(in srgb,var(--gel),transparent 52%);color:#fff;font:900 13px/1 ui-rounded,system-ui,sans-serif;text-shadow:0 1px 3px #051124ce;opacity:0;transform:translateY(-22px) scale(.7);transform-origin:center bottom;}
      .squish-loader-caption {margin:12px 0 0;color:#b0bed1;font:650 12px/1.4 ui-rounded,system-ui,sans-serif;letter-spacing:.015em;}
      [data-loading="running"] .squish-loader-fill {animation:loader-fill var(--loading-time,3820ms) linear both;}
      [data-loading="running"] .loading-squish {animation:loader-plop 440ms cubic-bezier(.2,.7,.3,1) both;animation-delay:calc(var(--loading-time,3820ms) * var(--step));}
      [data-loading="complete"] .squish-loader-fill {transform:scaleX(1);}
      [data-loading="complete"] .loading-squish {opacity:1;transform:none;}
      @keyframes loader-fill {to {transform:scaleX(1);}}
      @keyframes loader-plop {0% {opacity:0;transform:translateY(-22px) scale(.7);}32% {opacity:1;transform:translateY(0) scale(1.13,.69);}60% {opacity:1;transform:translateY(-4px) scale(.91,1.12);}82% {opacity:1;transform:translateY(0) scale(1.04,.93);}100% {opacity:1;transform:none;}}
      @media(max-height:500px) {.brand-lockup {gap:13px;}.brand-splash img {max-height:36svh;}.squish-loader-track {height:36px;padding:5px 7px;}.loading-squish {font-size:11px;}.squish-loader-caption {margin-top:8px;}}
      @media(prefers-reduced-motion:reduce) {[data-loading="running"] .loading-squish {animation-name:loader-appear;animation-duration:1ms;}@keyframes loader-appear {to {opacity:1;transform:none;}}}
      /* A single table menu follows the four-second logo splash. */
      .start-menu-overlay {position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:16px;background:#08080ad1;}
      .start-menu-overlay[hidden],.menu-button[hidden],.loading-retry[hidden] {display:none;}
        </style>

    <style>
      .lab-bar {position:absolute;left:3%;right:3%;top:153.5cqw;z-index:20;display:flex;flex-wrap:wrap;justify-content:center;gap:1.6cqw;}
      .lab-bar button {min-height:44px;padding:0 3.4cqw;border:1px solid #ffffff3a;border-radius:999px;color:#fff;background:#ffffff14;font:700 clamp(13px,3.6cqw,17px)/1 ui-rounded,system-ui,sans-serif;letter-spacing:.01em;cursor:pointer;-webkit-tap-highlight-color:transparent;}
      .lab-bar button[aria-pressed="true"] {background:#f6dc7b;color:#1c1408;border-color:#f6dc7b;}
      .lab-bar .lab-play {background:linear-gradient(180deg,#ff5d7e,#e0194f);border-color:#ff8aa3;padding:0 6cqw;}
      .lab-title {position:absolute;left:0;right:0;top:27cqw;margin:0;text-align:center;color:#c7cfdb;font:700 clamp(11px,3cqw,14px)/1.3 ui-rounded,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;}
      .playfield {touch-action:auto;}

  <body>
    <main class="game">
      <div class="game-stage">
        <header class="topbar">
          <section class="brand" aria-label="Squish attack"><h1><img src="../game/assets/squish-attack-logo-v1.png" alt="Squish attack" /></h1></section>
        </header>
        <p class="lab-title">Labor · Kissen verschmelzen</p>
        <section class="playfield" id="playfield" aria-label="Testfeld">
          <div class="board-slot" aria-hidden="true"></div>
          <div id="graphics" aria-hidden="true"></div>
          <div class="effects" id="effects" aria-hidden="true"></div>
        </section>
        <div class="lab-bar" role="toolbar" aria-label="Steuerung">
          <button class="lab-play" id="lab-play" type="button">Abspielen</button>
          <button type="button" data-count="2" aria-pressed="true">2 Kissen</button>
          <button type="button" data-count="3" aria-pressed="false">3</button>
          <button type="button" data-count="4" aria-pressed="false">4</button>
          <button type="button" data-count="5" aria-pressed="false">5</button>
          <button type="button" id="lab-slow" aria-pressed="false">Zeitlupe</button>
        </div>
      </div>
    </main>
